name: AirFryerSheet
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.airfryercheatsheet
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AirFryerSheet:
    type: application
    platform: iOS
    sources: [AirFryerSheet, Shared]
    dependencies:
      - target: AirFryerWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: AirFryerSheet AppStore
    entitlements:
      path: AirFryerSheet/AirFryerSheet.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.airfryercheatsheet]
    info:
      path: AirFryerSheet/Info.plist
      properties:
        CFBundleDisplayName: Air Fryer Cheat Sheet
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID)
            CFBundleURLSchemes: [airfryersheet]
  AirFryerWidget:
    type: app-extension
    platform: iOS
    sources:
      - AirFryerWidget
      - path: Shared
        includes: [L10n.swift, Localizable.xcstrings, WidgetData.swift, Domain.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: AirFryerSheet Widget AppStore
    entitlements:
      path: AirFryerWidget/AirFryerWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.airfryercheatsheet]
    info:
      path: AirFryerWidget/Info.plist
      properties:
        CFBundleDisplayName: Air Fryer Cheat Sheet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AirFryerSheetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AirFryerSheetTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  AirFryerSheetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AirFryerSheetUITests]
    dependencies:
      - target: AirFryerSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AirFryerSheet
schemes:
  AirFryerSheet:
    build:
      targets:
        AirFryerSheet: all
        AirFryerSheetTests: [test]
    test:
      config: Debug
      targets: [AirFryerSheetTests]
  AirFryerSheetUI:
    build:
      targets:
        AirFryerSheet: all
        AirFryerSheetUITests: [test]
    test:
      config: Debug
      targets: [AirFryerSheetUITests]
